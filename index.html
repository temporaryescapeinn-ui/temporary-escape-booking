<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporary Escape Inn — Booking quote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div id="siteBanner" class="banner" hidden></div>

  <header class="logo-slot">
    <img src="logo.png" alt="Temporary Escape Inn" onerror="this.style.display='none'; document.getElementById('logoFallback').hidden=false;">
    <p id="logoFallback" class="logo-fallback" hidden>temporary<span>escape</span></p>
  </header>

  <main class="card">

    <section>
      <h2 class="section-label">Room</h2>
      <div class="room-grid" id="roomGrid">
        <div class="room-card" data-room="standard" role="button" tabindex="0">
          <button type="button" class="room-info-btn" data-room-info="standard" aria-label="What is Standard?"><span aria-hidden="true">i</span></button>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9.5h16"/><rect x="6.5" y="5.3" width="4" height="3" rx="1"/><rect x="13.5" y="5.3" width="4" height="3" rx="1"/></svg>
          <span class="room-name">Standard</span>
        </div>
        <div class="room-card" data-room="white" role="button" tabindex="0">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9.5h16"/><rect x="6.5" y="5.3" width="4" height="3" rx="1"/><rect x="13.5" y="5.3" width="4" height="3" rx="1"/></svg>
          <span class="room-name">White</span>
        </div>
        <div class="room-card" data-room="blue" role="button" tabindex="0">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9.5h16"/><rect x="6.5" y="5.3" width="4" height="3" rx="1"/><rect x="13.5" y="5.3" width="4" height="3" rx="1"/></svg>
          <span class="room-name">Blue</span>
        </div>
      </div>
      <p id="roomInfoPanel" class="room-info-panel" hidden>Standard covers our Yellow, Orange and Green rooms.</p>
      <p id="roomNotice" class="room-notice" hidden></p>
    </section>

    <section>
      <div class="section-label-row">
        <h2 class="section-label">Check-in</h2>
        <span class="section-hint">Up to 3 weeks ahead</span>
      </div>
      <div class="chip-row">
        <button type="button" class="chip" data-day-target="checkin" data-offset="0">Today</button>
        <button type="button" class="chip" data-day-target="checkin" data-offset="1">Tomorrow</button>
      </div>
      <div class="field-row">
        <input type="date" id="checkinDate" required>
        <input type="time" id="checkinTime" required>
      </div>
    </section>

    <section>
      <h2 class="section-label">Shortcuts</h2>
      <div class="shortcut-grid">
        <button type="button" class="shortcut" data-shortcut="shortStay">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span>3hr</span>
        </button>
        <button type="button" class="shortcut" data-shortcut="overnight">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
          <span>Overnight</span>
        </button>
        <button type="button" class="shortcut" data-shortcut="halfDay">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Half day</span>
        </button>
        <button type="button" class="shortcut" data-shortcut="fullDay">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          <span>Full day</span>
        </button>
      </div>
    </section>

    <section>
      <h2 class="section-label">Checkout</h2>
      <div class="field-row">
        <input type="date" id="checkoutDate" required>
        <input type="time" id="checkoutTime" required>
      </div>
    </section>

  </main>

  <div class="price-panel">
    <p id="recapRoom" class="recap-room">Pick a room and time</p>
    <p id="recapTimes" class="recap-times"></p>
    <p id="packageLabel" class="package-label" hidden></p>
    <p id="priceValue" class="price-value" hidden></p>
    <p id="unavailableReason" class="unavailable-reason" hidden></p>
    <button type="button" id="whatsappBtn" class="whatsapp-btn" disabled>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span id="whatsappBtnLabel">Continue on WhatsApp</span>
    </button>
  </div>

</div>

<script src="pricing.js"></script>
<script src="app.js"></script>
</body>
</html>
